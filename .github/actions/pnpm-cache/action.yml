name: Cipher pnpm store cache
description: Restore everywhere; only the Build job may save the shared store.
inputs:
  writer:
    description: Whether this job owns cache writes (Build only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve pnpm store
      id: store
      shell: bash
      # Identical absolute path is required: cache versions include paths, and
      # the Build host and E2E container have different HOME directories.
      run: |
        echo "pnpm_config_store_dir=/tmp/cipher-pnpm-store" >> "$GITHUB_ENV"
        echo "path=/tmp/cipher-pnpm-store" >> "$GITHUB_OUTPUT"
    - name: Restore dependency store (read only)
      if: inputs.writer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: cipher-pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Restore and save dependency store (single writer)
      if: inputs.writer == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: cipher-pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
