name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create root .env
        shell: bash
        env:
          CI_ENV_FILE: ${{ secrets.CI_ENV_FILE }}
        run: |
          if [ -z "$CI_ENV_FILE" ]; then
            echo "::error::CI_ENV_FILE repository secret is unavailable"
            exit 1
          fi

          umask 077
          printf '%s' "$CI_ENV_FILE" > "$GITHUB_WORKSPACE/.env"

      - name: Run Vitest with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --coverage.reporter=lcov \
            --coverage.reporter=html

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            printf '## 📊 Coverage\n\n| Metric | %% |\n|---|---|\n' \
              >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              .total
              | to_entries[]
              | select(
                  .key
                  | IN("statements", "branches", "functions", "lines")
                )
              | "| \(.key) | \(.value.pct)% |"
            ' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Coverage summary was not generated." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    env:
      CI: true
      DATABASE_URL: postgresql://cipher:cipher@127.0.0.1:5432/cipher_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipher
          POSTGRES_PASSWORD: cipher
          POSTGRES_DB: cipher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipher -d cipher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Create root .env
        shell: bash
        env:
          CI_ENV_FILE: ${{ secrets.CI_ENV_FILE }}
        run: |
          if [ -z "$CI_ENV_FILE" ]; then
            echo "::error::CI_ENV_FILE repository secret is unavailable"
            exit 1
          fi

          umask 077
          printf '%s' "$CI_ENV_FILE" > "$GITHUB_WORKSPACE/.env"

      - name: Apply database migrations
        run: pnpm --filter @chat-app/api exec drizzle-kit migrate

      - name: Build application
        run: pnpm --filter web build

      - name: Run Chromium E2E tests
        run: pnpm test:e2e -- --project=chromium

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
