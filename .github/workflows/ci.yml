name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      next_cache:
        description: 'Benchmark Next.js cache (off by default: measured overhead exceeded savings)'
        type: boolean
        default: false

# Disposable, non-production values: fork PRs need no repository secrets.
env:
  NEXT_PUBLIC_API_URL: http://localhost:3001
  CLIENT_ORIGIN: http://localhost:3000
  BACKEND_PORT: '3001'
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  SESSION_SECRET: cipher-ci-only-not-for-production-32-characters
  GITHUB_AUTH_ENABLED: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Change Scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI routing and gates
        run: node --test scripts/ci/*.test.mjs
      - name: Classify changed paths (fail closed)
        id: scope
        run: node scripts/ci/scope.mjs

  format:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Biome)
        run: pnpm exec biome ci --reporter=github

  lint:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint --deny-warnings --format=github

  typecheck:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Typecheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  build:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Build
    runs-on: ubuntu-24.04

    env:
      CI: true
      # Placeholder values so the build does not depend on repository secrets
      # (secrets are not available to pull requests from forks).
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (designated writer)
        uses: ./.github/actions/pnpm-cache
        with:
          writer: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js compiler cache
        if: github.event_name == 'workflow_dispatch' && inputs.next_cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-node24-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/ci.yml', 'apps/web/next.config.ts', '**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-node24-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/ci.yml', 'apps/web/next.config.ts', '**/tsconfig.json') }}-

      - name: Build all packages
        run: pnpm build

      - name: Package web runtime (preserve hidden manifests; exclude compiler cache)
        shell: bash
        run: tar -C apps/web --exclude=.next/cache --exclude=.next/dev -cf - .next | gzip -1 > web-build.tgz

      - name: Upload exact-run web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-build.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  unit:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: Unit Tests
    runs-on: ubuntu-24.04

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --coverage.reporter=lcov \
            --coverage.reporter=html

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            printf '## 📊 Coverage\n\n| Metric | %% |\n|---|---|\n' \
              >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              .total
              | to_entries[]
              | select(
                  .key
                  | IN("statements", "branches", "functions", "lines")
                )
              | "| \(.key) | \(.value.pct)% |"
            ' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Coverage summary was not generated." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  postgres:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: PostgreSQL Tests
    runs-on: ubuntu-24.04

    env:
      CI: true
      DATABASE_URL: postgresql://cipher:cipher@127.0.0.1:5432/cipher_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipher
          POSTGRES_PASSWORD: cipher
          POSTGRES_DB: cipher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipher -d cipher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @chat-app/api exec drizzle-kit migrate

      - name: Verify session auth against PostgreSQL
        env:
          SESSION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm test:unit:api --no-file-parallelism

  e2e:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/ajahann/cipher-e2e:pw1.63.0-node24.11.1-e6c0ae22e74bab090fabb0a06c4af3efe10e8c7a@sha256:bfaebb0ce67c5ed4b04e3587f3c20e95c5bf6d9dc3a1f74d3c7f6ed559666474
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read

    env:
      CI: true
      PLAYWRIGHT_IMAGE_VERSION: '1.63.0'
      DATABASE_URL: postgresql://cipher:cipher@postgres:5432/cipher_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipher
          POSTGRES_PASSWORD: cipher
          POSTGRES_DB: cipher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipher -d cipher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled toolchain
        run: |
          test "$(node --version)" = v24.11.1
          test "$(pnpm --version)" = 12.6.0

      # Build is the only store-cache writer; PR caches remain PR-scoped.
      - name: Restore pnpm store (read only)
        uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright matches the pinned browser image
        run: |
          node -e "const installed = require('@playwright/test/package.json').version; if (installed !== process.env.PLAYWRIGHT_IMAGE_VERSION) throw new Error('Update the Playwright image tag, digest and version together with the lockfile: installed ' + installed);"

      - name: Apply database migrations
        run: pnpm --filter @chat-app/api exec drizzle-kit migrate

      - name: Wait for exact-run web build (setup stays parallel)
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT: web-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/wait-artifact.mjs

      - name: Download exact-run web build
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore web runtime
        run: tar -xzf web-build.tgz -C apps/web

      - name: Run Chromium E2E tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: CI Gate
    if: always()
    needs: [scope, format, lint, typecheck, build, unit, postgres, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require all expected acceptance results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
      - name: Record job and step timings
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          CACHE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.next_cache }}
        run: node scripts/ci/timings.mjs
      - name: Upload timing evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings
          path: ci-timings.json
          if-no-files-found: warn
          retention-days: 14
